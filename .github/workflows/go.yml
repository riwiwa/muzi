# Builds and tests muzi, and checks that the Docker image starts with Compose

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:

  build:
    runs-on: ubuntu-latest
    # a throwaway database for the integration tests (internal/dbtest)
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: muzi
          POSTGRES_PASSWORD: muzi
          POSTGRES_DB: muzi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U muzi -d muzi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'

    - name: Build
      run: go build -v ./...

    - name: Vet
      run: go vet ./...

    - name: Test (including integration tests against PostgreSQL)
      env:
        MUZI_TEST_DATABASE_URL: postgres://muzi:muzi@localhost:5432/muzi_test
      # the default shell runs with pipefail, so a failing test still fails this step
      run: go test -v ./... 2>&1 | tee test.log

    - name: Make sure the integration tests ran instead of skipping
      run: |
        if grep -q -- "--- SKIP" test.log; then grep -- "--- SKIP" test.log; echo "integration tests were skipped"; exit 1; fi

  docker:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Start muzi and PostgreSQL with Compose
      env:
        MUZI_DB_PASSWORD: ci-password
      run: docker compose up -d --build

    - name: Wait for the web UI
      run: |
        for i in $(seq 60); do
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:1234/createaccount || true)
          if [ "$code" = "200" ]; then echo "muzi is up"; exit 0; fi
          sleep 2
        done
        echo "muzi did not come up"; exit 1

    - name: Check pages and assets
      run: |
        curl -fsS -o /dev/null http://localhost:1234/files/style.css
        curl -fsS -o /dev/null http://localhost:1234/files/app.js
        test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:1234/files/uploads/)" = 404

    - name: Logs
      if: always()
      env:
        MUZI_DB_PASSWORD: ci-password
      run: docker compose logs

    - name: Stop
      if: always()
      env:
        MUZI_DB_PASSWORD: ci-password
      run: docker compose down -v
