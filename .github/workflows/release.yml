# Publishes a release when a version tag (v1.2.3) is pushed: binaries for each platform with
# checksums on the GitHub release, and a Docker image on the GitHub Container Registry.

name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write
  packages: write

jobs:

  binaries:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'

    - name: Test
      run: go test ./...

    - name: Build
      run: |
        set -eu
        version="${GITHUB_REF_NAME}"
        mkdir -p dist
        for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
          os="${target%/*}"; arch="${target#*/}"
          name="muzi_${version}_${os}_${arch}"
          ext=""; [ "$os" = windows ] && ext=".exe"
          mkdir -p "build/$name"
          CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
            -ldflags="-s -w -X main.version=${version}" -o "build/$name/muzi$ext" .
          cp README.md LICENSE "build/$name/"
          cp config.toml "build/$name/config.example.toml"
          if [ "$os" = windows ]; then
            (cd build && python3 -m zipfile -c "../dist/$name.zip" "$name")
          else
            tar -C build -czf "dist/$name.tar.gz" "$name"
          fi
        done
        (cd dist && sha256sum * > SHA256SUMS)
        ls -l dist

    - name: Check a built binary reports its version
      run: |
        tar -xzf "dist/muzi_${GITHUB_REF_NAME}_linux_amd64.tar.gz" -C /tmp
        /tmp/muzi_${GITHUB_REF_NAME}_linux_amd64/muzi -version | grep -qx "muzi ${GITHUB_REF_NAME}"

    - name: Create the GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag

  image:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: docker/setup-qemu-action@v3
    - uses: docker/setup-buildx-action@v3

    - name: Log in to the GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Image tags
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        build-args: VERSION=${{ github.ref_name }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
